<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月间 · 塔罗小屋</title><style>
*{box-sizing:border-box}body{margin:0;background:#111321;color:#eee7d8;font:15px/1.7 system-ui}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 25%,#66508238,transparent 60%)}main{max-width:1080px;margin:auto;padding:28px 24px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff16;padding-bottom:20px;letter-spacing:3px}small,.muted{color:#a9a2b6}header{text-align:center;padding:48px 0 28px}h1{font-family:serif;font-size:44px;font-weight:400;margin:10px}header p{color:#aaa3b7}.moon{color:#ddc58b;font-size:42px}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff25;border-radius:9px;background:#ffffff06;padding:10px 22px}button:hover{border-color:#cfb67e}button.active,.primary{background:#dbc390;color:#252033;border-color:#dbc390}.controls{max-width:620px;margin:auto;text-align:center}.modes{display:flex;justify-content:center;gap:12px}input{width:100%;background:#ffffff05;border:1px solid #ffffff20;border-radius:10px;color:#eee;padding:13px 16px;margin:22px 0 16px}input:focus{outline:1px solid #dbc390}.primary{min-width:180px}.cards{display:flex;justify-content:center;gap:25px;margin:40px 0;flex-wrap:wrap}.slot{width:210px;text-align:center}.position{color:#c1b18f;letter-spacing:4px;font-size:12px;margin-bottom:12px}.card{width:100%;height:310px;border:1px solid #bba47280;border-radius:12px;background:linear-gradient(145deg,#29263f,#191b30);padding:12px;transition:transform .5s;box-shadow:0 15px 40px #0004;display:flex;align-items:center;justify-content:center}.card:hover{transform:translateY(-6px)}.inside{border:1px solid #bba47250;width:100%;height:100%;border-radius:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle,#bda27614,transparent 70%)}.symbol{font-size:70px;color:#dec58e;line-height:1.5}.card h2{font-family:serif;font-size:22px;font-weight:400;margin:12px 0 0}.roman{font-size:12px;letter-spacing:3px;color:#c3b390}.badge{font-size:12px;color:#d3c2a3}.reading{max-width:760px;margin:0 auto}.interpretation{padding:20px 0;border-bottom:1px solid #ffffff12}.interpretation h3{color:#e2cca0;font-weight:500}.interpretation p{color:#bdb7c8}.history{margin:50px auto 20px;max-width:760px;border-top:1px solid #ffffff20;padding-top:20px}.history summary{cursor:pointer;color:#bbb1c7}.history article{padding:12px 0;border-bottom:1px solid #ffffff10}.history button{padding:3px 10px;font-size:12px;float:right}footer{text-align:center;color:#777286;font-size:12px;padding:28px}.hint{text-align:center;color:#9b92a9;font-size:13px}@media(max-width:650px){h1{font-size:34px}.cards{gap:10px}.slot{width:calc((100% - 20px)/3)}.card{height:210px;padding:6px}.symbol{font-size:40px}.card h2{font-size:16px}.roman{font-size:9px;letter-spacing:0}.slot:only-child{width:210px}.slot:only-child .card{height:310px}header{padding-top:30px}}
</style><main><nav><span>☾ 月间 TAROT</span><small>留一刻，与自己对话</small></nav><header><div class="moon">☾</div><small>YOUR QUIET MOMENT</small><h1>答案，从倾听内心开始</h1><p>放慢呼吸，让一张牌为思绪带来新的角度。</p></header><section class="controls"><div class="modes"><button class="active" data-mode="1">单张 · 此刻指引</button><button data-mode="3">三张 · 时间之流</button></div><input id="question" maxlength="150" placeholder="写下你想探索的问题（选填）" aria-label="你想探索的问题"><button id="draw" class="primary">静心，开始抽牌 ✧</button></section><div id="cards" class="cards"></div><div id="hint" class="hint">22 张大阿尔卡那 · 随机正逆位</div><section id="reading" class="reading" aria-live="polite"></section><details class="history"><summary>我的抽牌记录 <span id="count"></span></summary><div id="history"></div><button id="clear">清空记录</button></details><footer>塔罗是自我探索的灵感工具，解读仅供娱乐与反思。记录仅保存在当前浏览器。</footer></main><script>
const data=[
['愚者','☀','新的开始、自由、好奇','允许自己迈出一小步，在探索中积累经验。','先检查准备是否充分，避免因冲动忽略现实限制。'],
['魔术师','✦','创造、行动、资源','盘点手中的资源，把想法转化为一个具体行动。','注意力可能过于分散，先聚焦一件真正重要的事。'],
['女祭司','☾','直觉、静观、潜意识','给自己安静的空间，留意尚未说出口的感受。','别急着猜测他人的想法，用事实验证你的直觉。'],
['皇后','❀','滋养、丰盛、创造','照顾身体与情绪，为正在成长的事物留出空间。','检查自己是否付出过多，也给自己的需求留一个位置。'],
['皇帝','♜','秩序、责任、边界','建立清晰的计划和边界，让行动更稳固。','试着松动过于僵硬的规则，为不同意见保留余地。'],
['教皇','⌘','学习、传统、信念','向可靠的经验学习，同时厘清你真正认同的价值。','重新审视习惯中的规则，找到适合自己的路径。'],
['恋人','♡','关系、选择、契合','让选择与内在价值一致，真诚表达你的需求。','面对分歧时先厘清期待，避免为了迎合而忽略自己。'],
['战车','♞','方向、意志、推进','选定方向后稳步推进，把精力放在可控制的行动上。','暂停一下校准方向，速度并不总是进展的证明。'],
['力量','∞','勇气、耐心、温柔','用耐心与温和的坚持应对挑战，不必强迫自己。','留意疲惫与自我怀疑，恢复精力后再处理困难。'],
['隐者','✧','独处、内省、寻找','暂时减少外界噪声，写下你自己的判断。','独处过久可能让思绪打转，试着向可信任的人交流。'],
['命运之轮','☸','变化、周期、转机','接纳阶段的变化，寻找当下能够把握的机会。','面对反复出现的模式，尝试改变一个小习惯。'],
['正义','⚖','公平、事实、承担','看清事实与后果，做出能对自己负责的决定。','检查判断是否受到偏见影响，补充信息后再决定。'],
['倒吊人','◇','暂停、换位、放下','换一个角度看待停滞，允许答案慢慢浮现。','辨别等待与拖延，为下一步设置一个明确时间。'],
['死神','❦','结束、转化、更新','为不再合适的阶段收尾，让新的可能拥有空间。','留意对改变的抗拒，从一个可承受的小调整开始。'],
['节制','♧','平衡、调和、节奏','在不同需求之间找到适度的节奏，循序渐进。','重新安排精力，避免在两个极端之间反复消耗。'],
['恶魔','♑','依附、诱惑、束缚','看见让你受限的习惯，找回一个可以自主选择的地方。','你可能开始意识到旧有束缚，给改变提供实际支持。'],
['高塔','ϟ','动摇、揭示、重建','当旧有认知受到挑战，先稳定自己，再重建基础。','留意一直被忽略的问题，及早进行温和调整。'],
['星星','☆','希望、疗愈、信任','为自己保留希望，用日常的小行动恢复信心。','把抽象的期待变成具体步骤，减少与他人的比较。'],
['月亮','☽','未知、情绪、想象','信息尚不清晰，先观察情绪，避免仓促下结论。','试着区分事实与担忧，让模糊的感受有机会被说清。'],
['太阳','☼','喜悦、活力、清晰','看见已经取得的进展，与人分享真实的喜悦。','调整过高的期待，简单的快乐也值得被珍惜。'],
['审判','♬','觉察、回顾、回应','回顾过往的经验，带着新的理解回应当下。','减少苛责自己，把复盘变成下一次行动的帮助。'],
['世界','◎','完成、整合、阶段','认可一个阶段的成果，整理经验后开启新旅程。','为尚未收尾的事安排最后一步，允许不完美的完成。']];
let mode=1,busy=false,records=[];try{records=JSON.parse(localStorage.getItem('moon-tarot-v1')||'[]');if(!Array.isArray(records))records=[]}catch{}
const $=id=>document.getElementById(id);function persist(){try{localStorage.setItem('moon-tarot-v1',JSON.stringify(records))}catch{ $('hint').textContent='浏览器未允许保存，本次抽牌仍可正常使用。'}}
function backs(){ $('cards').innerHTML=Array.from({length:mode},(_,i)=>`<div class="slot"><div class="position">${mode===1?'此刻的你':['过去','现在','未来'][i]}</div><div class="card"><div class="inside"><span class="roman">MOON TAROT</span><div class="symbol">☾</div><span class="roman">✦ · ✧ · ✦</span></div></div></div>`).join('')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(busy)return;mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));backs();$('reading').replaceChildren()});
function random(n){let a=new Uint32Array(1);const limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
function show(r){mode=r.cards.length;$('cards').innerHTML=r.cards.map((c,i)=>{const d=data[c.id];return `<div class="slot"><div class="position">${mode===1?'此刻指引':['过去 · 经验','现在 · 觉察','未来 · 可能'][i]}</div><div class="card"><div class="inside"><span class="roman">${String(c.id).padStart(2,'0')} · ARCANA</span><div class="symbol" style="transform:rotate(${c.rev?180:0}deg)">${d[1]}</div><h2>${d[0]}</h2><span class="badge">${c.rev?'逆位':'正位'}</span></div></div></div>`}).join('');$('reading').replaceChildren();if(r.question){const p=document.createElement('p');p.textContent='你想探索：'+r.question;$('reading').append(p)}r.cards.forEach((c,i)=>{const d=data[c.id],el=document.createElement('article');el.className='interpretation';const h=document.createElement('h3');h.textContent=(mode===3?['过去｜','现在｜','未来｜'][i]:'')+d[0]+' · '+(c.rev?'逆位':'正位');const p=document.createElement('p');p.textContent=d[2]+'。'+d[c.rev?4:3];el.append(h,p);$('reading').append(el)});$('hint').textContent='把解读当作一个提问：它让你想到了什么？未来牌表达探索方向，并非预言。'}
function history(){ $('count').textContent=`（${records.length}）`;$('history').replaceChildren();records.forEach(r=>{const el=document.createElement('article'),b=document.createElement('button'),s=document.createElement('div');s.textContent=new Date(r.time).toLocaleString('zh-CN')+' · '+r.cards.map(c=>data[c.id][0]).join(' / ');b.textContent='回看';b.onclick=()=>{if(!busy){show(r);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',Number(x.dataset.mode)===mode));$('question').value=r.question;window.scrollTo({top:0,behavior:'smooth'})}};el.append(b,s);$('history').append(el)})}
$('draw').onclick=async()=>{if(busy)return;busy=true;$('draw').disabled=true;$('draw').textContent='正在洗牌…';$('reading').replaceChildren();backs();await new Promise(r=>setTimeout(r,650));const pool=data.map((_,i)=>i),cards=[];for(let i=0;i<mode;i++)cards.push({id:pool.splice(random(pool.length),1)[0],rev:random(2)===1});const r={time:Date.now(),question:$('question').value.trim(),cards};show(r);records.unshift(r);records=records.slice(0,30);persist();history();busy=false;$('draw').disabled=false;$('draw').textContent='再抽一次 ✧'};
$('clear').onclick=()=>{if(records.length&&confirm('清空当前浏览器中的全部抽牌记录？')){records=[];persist();history()}};backs();history();
</script></html>
